<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In lịch theo ngày tháng năm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style12.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="calendar-card p-4 bg-white rounded shadow-sm">
            
            <div id="calendar-display" class="text-center p-3 mb-3 border rounded bg-light">
                <div id="year-display" class="year-text">2026</div>
                <div id="month-display" class="month-text">Tháng 10</div>
                <div id="day-display" class="day-number">20</div>
                <div id="weekday-display" class="weekday-text">Thứ ba</div>
            </div>

            <div id="greeting-display" class="text-center mb-4 text-muted fst-italic">
                Chào buổi sáng
            </div>

            <div class="input-form-box p-3 border rounded">
                <div class="row g-2 align-items-end justify-content-center">
                    <div class="col-3">
                        <label for="input-day" class="form-label text-center w-100">Ngày</label>
                        <input type="number" id="input-day" class="form-control text-center" value="20">
                    </div>
                    <div class="col-3">
                        <label for="input-month" class="form-label text-center w-100">Tháng</label>
                        <input type="number" id="input-month" class="form-control text-center" value="10">
                    </div>
                    <div class="col-3">
                        <label for="input-year" class="form-label text-center w-100">Năm</label>
                        <input type="number" id="input-year" class="form-control text-center" value="2026">
                    </div>
                    <div class="col-3 text-center">
                        <button id="button-print" class="btn btn-custom-print w-100">In lịch</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="bai12.js"></script>
</body>
</html>
