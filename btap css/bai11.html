<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Việt Nam</title>
    <link rel="stylesheet" href="style11.css">
</head>
<body>

    <div class="header">
        <h1>Thư Viện Ảnh Việt Nam</h1>
        <p>Bộ sưu tập 6 danh lam thắng cảnh tiêu biểu - minh họa thẻ figure/figcaption</p>
    </div>

    <div class="gallery">
        <figure>
            <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
            <figcaption>1.Vịnh Hạ Long</figcaption>
        </figure>

        <figure>
            <img src="2-son-doong.jpg" alt="Phố cổ Hội An">
            <figcaption>2.Hang Sơn Đòong</figcaption>
        </figure>

        <figure>
            <img src="3-thac-ban-gioc.jpg" alt="Ruộng bậc thang Mù Cang Chải">
            <figcaption>3.Thác Bản Giốc</figcaption>
        </figure>

        <figure>
            <img src="4-fansipan.jpg" alt="Đà Lạt">
            <figcaption>4.Fansipan</figcaption>
        </figure>

        <figure>
            <img src="5-mekong.jpg" alt="Cố đô Huế">
            <figcaption>5.Đồng bằng sông Cửu Long</figcaption>
        </figure>

        <figure>
            <img src="6-phong-nha.jpg" alt="Đảo Phú Quốc">
            <figcaption>6.Động Phong Nha</figcaption>
        </figure>
    </div>
</body>
</html>
