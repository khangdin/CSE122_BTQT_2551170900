<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách món ăn</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

    <h2>DANH SÁCH MÓN ĂN NGON</h2>

    <div class="container">
        <div class="lbox">
            <img src="Bat.gif" alt="Ảnh minh họa các món ăn ngon">
        </div>

        <div class="rbox">
            <table class="food">
                <thead>
                    <tr>
                        <th class="stt">STT</th>
                        <th class="name">Tên món ăn</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="stt">1</td>
                        <td class="name">Phở bò Hà Nội</td>
                    </tr>
                    <tr>
                        <td class="stt">2</td>
                        <td class="name">Bún chả Hà Nội</td>
                    </tr>
                    <tr>
                        <td class="stt">3</td>
                        <td class="name">Bánh mì Sài Gòn</td>
                    </tr>
                    <tr>
                        <td class="stt">4</td>
                        <td class="name">Cơm tấm Sài Gòn</td>
                    </tr>
                    <tr>
                        <td class="stt">5</td>
                        <td class="name">Bún bò Huế</td>
                    </tr>
                    <tr>
                        <td class="stt">6</td>
                        <td class="name">Mì Quảng</td>
                    </tr>
                    <tr>
                        <td class="stt">7</td>
                        <td class="name">Cao lầu Hội An</td>
                    </tr>
                    <tr>
                        <td class="stt">8</td>
                        <td class="name">Bánh xèo miền Tây</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
