<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Thơ Bốn Mùa</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        .poem-container {
            width: 600px;
            margin: 0 auto;
            background-color: #fffde7;
            border: 1px solid #cccccc;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .poem-title {
            background-color: #f8bbd0;
            color: #d32f2f;
            text-align: center;
            font-weight: bold;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .poem-stanza {
            text-align: center;
            font-style: italic;
            font-weight: 500;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .stanza-red {
            color: #d32f2f;
        }

        .stanza-blue {
            color: #1976d2;
        }

        .divider {
            height: 1px;
            background-color: #1976d2;
            width: 55%;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="poem-container">
        <div class="poem-title">BỐN MÙA</div>
        <div class="poem-stanza stanza-blue">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm.
        </div>
        <div class="divider"></div>
        <div class="poem-stanza stanza-red">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </div>
        <div class="divider"></div>
        <div class="poem-stanza stanza-blue">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </div>
    </div>
</body>
</html>
