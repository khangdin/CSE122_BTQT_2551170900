<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT21 - Bố cục trang 4 vùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style21.css">
</head>
<body>

    <header class="banner-container d-flex align-items-center px-3">
        <div class="logo-area me-3">
            <img src="LogoTT.gif" alt="Logo" class="logo-image img-fluid">
        </div>
        <div class="banner-area flex-grow-1">
            <img src="Nen_banner.jpg" alt="Banner" class="banner-image img-fluid w-100">
        </div>
    </header>

    <div class="container-fluid">
        <div class="row g-0 min-vh-100">
            
            <aside class="col-12 col-md-3 col-lg-2 sidebar d-flex flex-column p-3 text-white">
                <h5 class="text-uppercase fw-bold mb-3">Menu Bài Tập</h5>
                <nav class="nav flex-column">
                    <a class="nav-link text-white border-bottom border-light-subtle py-2" href="#">Bài tập 1: Đảo chuỗi</a>
                    <a class="nav-link text-white border-bottom border-light-subtle py-2" href="#">Bài tập 2: Phân tích chuỗi</a>
                    <a class="nav-link text-white border-bottom border-light-subtle py-2" href="#">Bài tập 3: Thay thế</a>
                </nav>
            </aside>

            <main class="col-12 col-md-7 col-lg-8 content-area bg-white p-4">
                <h2 class="exercise-title fw-bold mb-3">Trang Chủ / Xử Lý Chuỗi Văn Bản</h2>
                
                <div class="submenu-box p-3 mb-4 rounded">
                    <ul class="submenu-list list-unstyled d-flex flex-wrap gap-4 mb-0">
                        <li><a href="#" class="text-decoration-none text-dark">Đảo chuỗi</a></li>
                        <li><a href="#" class="text-decoration-none text-dark">Phân tích chuỗi</a></li>
                        <li><a href="#" class="text-decoration-none text-dark">Tìm & Thay thế</a></li>
                    </ul>
                </div>

                <div class="content-box border p-3 rounded">
                    <p class="text-muted">Nội dung chi tiết của bài tập sẽ hiển thị tại đây...</p>
                    <div class="mb-3">
                        <label for="inputText" class="form-label">Nhập văn bản:</label>
                        <input type="text" class="form-control" id="inputText" placeholder="Nhập chuỗi bất kỳ...">
                    </div>
                    <button class="btn btn-danger" id="processBtn">Thực hiện</button>
                    <div class="mt-3" id="resultArea"></div>
                </div>
            </main>

            <aside class="col-12 col-md-2 col-lg-2 ads-sidebar d-flex flex-column align-items-center p-3 gap-3">
                <div class="ads-banner border rounded w-100 text-center p-3 text-muted bg-light">Quảng cáo 1</div>
                <div class="ads-banner border rounded w-100 text-center p-3 text-muted bg-light">Quảng cáo 2</div>
            </aside>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="bai21.js"></script>
</body>
</html>
