<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Ảnh Với CSS Filter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style20.css">
</head>
<body>

    <svg style="height: 0; width: 0; position: absolute;" aria-hidden="true">
        <filter id="wave-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="2" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <main class="main-container">
        <section class="content-section text-center">
            <figure class="mb-3">
                <img id="row-image" src="hoahong.gif" class="effect-gray" alt="Bông hồng nghệ thuật">
            </figure>
            <p class="special-text">Special For You</p>
        </section>

        <nav class="nav-buttons d-flex flex-wrap justify-content-center gap-2 mt-4" aria-label="Bộ lọc hiệu ứng">
            <button class="btn btn-dark active" data-effect="effect-gray">Gray</button>
            <button class="btn btn-dark" data-effect="effect-xgray">X-Ray</button>
            <button class="btn btn-dark" data-effect="effect-inverse">Invert</button>
            <button class="btn btn-dark" data-effect="effect-fliph">FlipH</button>
            <button class="btn btn-dark" data-effect="effect-flipv">FlipV</button>
            <button class="btn btn-dark" data-effect="effect-glow">Glow</button>
            <button class="btn btn-dark" data-effect="effect-shadow">Shadow</button>
            <button class="btn btn-dark" data-effect="effect-bshadow">Bold Shadow</button>
            <button class="btn btn-dark" data-effect="effect-dshadow">Drop Shadow</button>
            <button class="btn btn-dark" data-effect="effect-blur">Blur</button>
            <button class="btn btn-dark" data-effect="effect-wave">Wave</button>
            <button class="btn btn-dark" data-effect="effect-mask">Mask</button>
            <button class="btn btn-dark" data-effect="effect-alpha">Alpha</button>
        </nav>
    </main>

    <script src="bai20.js"></script>
</body>
</html>
