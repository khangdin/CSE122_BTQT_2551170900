<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Việc Cần Làm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style16.css">
</head>
<body>

    <div class="app-card">
        <div class="app-header">
            <h4 class="fw-bold mb-2">Danh Sách Việc Cần Làm</h4>
            <p class="text-white-50 mb-0 small">Thêm việc mới, đánh dấu hoàn thành hoặc xóa - Tất cả bằng javascript</p>
        </div>

        <div class="p-3 border-bottom">
            <div class="input-group">
                <input type="text" id="task-input" class="form-control" placeholder="Hoàn thành bài tập lập trình web...">
                <button id="add-button" class="btn btn-custom">Thêm</button>
            </div>
        </div>

        <ul id="task-list" class="list-unstyled mb-0"></ul>

        <div id="task-counter" class="app-footer"></div>
    </div>

    <script src="bai16.js"></script>
</body>
</html>
